# GPT (ChatGPT / Codex) bundle for DeepSeek Harness.
#
# This bundle declares the plugin row. It deliberately does NOT patch
# `llm-pi-ai`: a Cordis patch replaces a matched entry's whole config instead of
# deep-merging it, and the profile's own cordis.patch.yml already carries
# `llm-pi-ai`'s providers — a bundle-level patch would be replaced at the
# profile layer. The plugin adds the `openai-codex` route through
# `ctx.settings.mutate()`, the same write path the Models page uses, so the
# value lands in the layer that actually wins.
#
# codexAuthPath:       override where the Codex CLI keeps auth.json.
#                      Empty means $CODEX_HOME or ~/.codex.
# proxy:               HTTP(S) proxy for auth.openai.com and chatgpt.com.
#                      Empty means fall back to HTTPS_PROXY/HTTP_PROXY, then
#                      direct. On Node >= 24.14 the plugin rebuilds the global
#                      fetch dispatcher at load time and restores it on unload.
#                      Loopback requests bypass the proxy. Set this whenever
#                      the app cannot reach OpenAI directly.
# autoEnableRoute:     add the openai-codex provider route automatically once a
#                      ChatGPT credential exists. Set false to configure it by
#                      hand.
# endpoints:           extra stream endpoints whose tool-call slots this plugin
#                      repairs, when the route points at a relay instead of the
#                      Codex backend. Strings are Responses streams; use
#                      `{ url, dialect: completions }` for a chat-completions one.
# retryMalformedResponses:
#                      add `MALFORMED_RESPONSE` to the route's retry codes (2
#                      retries). Recovers the turn when a response's tool
#                      arguments cannot be parsed at all. Set false to keep the
#                      route profile at `transport` only.

- insert:
    - id: gpt-codex
      name: 'dsh-gpt-codex'
      config:
        codexAuthPath: ''
        proxy: 'http://127.0.0.1:7897'
        autoEnableRoute: true
        retryMalformedResponses: true
        endpoints: []
